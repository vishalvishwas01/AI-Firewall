[build-system]
requires = ["setuptools==83.0.0", "wheel==0.47.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hallguard-ml"
version = "0.0.0"
description = "Offline, privacy-governed HallGuard logistic model tooling"
requires-python = "==3.14.*"
dependencies = [
  "numpy==2.5.1",
  "pandas==3.0.5",
  "scikit-learn==1.9.0",
]

[project.optional-dependencies]
dev = [
  "mypy==2.3.0",
  "pytest==9.1.1",
  "ruff==0.16.1",
]

[project.scripts]
hallguard-ml-validate = "hallguard_ml.validate_workspace:main"
hallguard-ml-generate = "hallguard_ml.generate:main"
hallguard-ml-train = "hallguard_ml.train:main"
hallguard-ml-evaluate = "hallguard_ml.evaluate:main"
hallguard-ml-intake = "hallguard_ml.intake:main"
hallguard-ml-remediate = "hallguard_ml.remediate:main"
hallguard-ml-targeted-review = "hallguard_ml.targeted_review:main"
hallguard-ml-representative = "hallguard_ml.representative:main"
hallguard-ml-run-profile = "hallguard_ml.run_profile:main"
hallguard-ml-run-candidate = "hallguard_ml.run_candidate:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--strict-config --strict-markers"

[tool.ruff]
target-version = "py314"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]

[tool.mypy]
python_version = "3.14"
strict = true
packages = ["hallguard_ml"]
disable_error_code = ["import-untyped"]
