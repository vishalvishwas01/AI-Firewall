<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width" />
    <title>{{SUBJECT}}</title>
  </head>
  <body
    style="
      margin: 0;
      background: #f4f3f1;
      color: #33312b;
      font-family: Arial, Helvetica, sans-serif;
    "
  >
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
      <tr>
        <td align="center" style="padding: 32px 16px">
          <table role="presentation" width="100%" style="max-width: 620px">
            <tr>
              <td style="padding: 0 8px 18px">
                <img
                  src="{{LOGO_URL}}"
                  width="40"
                  height="40"
                  alt="HallGuard"
                  style="vertical-align: middle; border-radius: 10px"
                /><strong
                  style="
                    margin-left: 10px;
                    vertical-align: middle;
                    font-size: 20px;
                    color: #33312b;
                  "
                  >HallGuard</strong
                >
              </td>
            </tr>
            <tr>
              <td
                style="
                  background: #fff;
                  border: 1px solid #ddd9d1;
                  border-radius: 14px;
                  padding: 40px 42px;
                "
              >
                <p
                  style="
                    margin: 0 0 12px;
                    color: #087f78;
                    font-size: 12px;
                    font-weight: 700;
                    letter-spacing: 1.4px;
                    text-transform: uppercase;
                  "
                >
                  SUPPORT REPLY
                </p>
                <h1
                  style="
                    margin: 0;
                    color: #24231f;
                    font-size: 30px;
                    line-height: 1.2;
                  "
                >
                  {{HEADING}}
                </h1>
                <p style="margin: 22px 0 0; font-size: 16px; line-height: 1.7">
                  Hi {{NAME}},
                </p>
                <div
                  style="margin: 12px 0 0; font-size: 16px; line-height: 1.7"
                >
                  {{MESSAGE}}
                </div>
                <p
                  style="
                    margin: 28px 0 0;
                    color: #65645e;
                    font-size: 13px;
                    line-height: 1.6;
                  "
                >
                  Hope we solve your issue. Please do not reply to this email
                </p>
              </td>
            </tr>
            <tr>
              <td
                style="
                  padding: 24px 8px;
                  color: #77756e;
                  font-size: 12px;
                  line-height: 1.7;
                "
              >
                HallGuard helps keep sensitive information protected during AI
                conversations.<br /><a
                  href="{{APP_URL}}/trust"
                  style="color: #65645e"
                  >Trust</a
                >&nbsp;&nbsp;<a
                  href="{{APP_URL}}/privacy"
                  style="color: #65645e"
                  >Privacy</a
                >&nbsp;&nbsp;<a href="{{APP_URL}}/help" style="color: #65645e"
                  >Help</a
                ><br />© {{YEAR}} HallGuard. All rights reserved.
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
